name: Node.js CI/CD to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout code
    -  name: Checkout code
  uses: actions/checkout@v3
  with:
    fetch-depth: 0

    # 2. Configure AWS credentials
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1  # change if needed

    # 3. Login to ECR
    - name: Login to Amazon ECR
      id: ecr-login
      uses: aws-actions/amazon-ecr-login@v2

    # 4. Build Docker image
    - name: Build Docker image
      run: |
        IMAGE_NAME=harinnavis/nodejs-app:latest
        docker build -t $IMAGE_NAME ./app

    # 5. Tag Docker image for ECR
    - name: Tag Docker image
      run: |
        ACCOUNT_ID=${{ secrets.AWS_ACCOUNT_ID }}
        REGION=us-east-1
        IMAGE_NAME=harinnavis/nodejs-app:latest
        docker tag $IMAGE_NAME $ACCOUNT_ID.dkr.ecr.$REGION.amazonaws.com/nodejs-app:latest

    # 6. Push Docker image to ECR
    - name: Push Docker image
      run: |
        ACCOUNT_ID=${{ secrets.AWS_ACCOUNT_ID }}
        REGION=us-east-1
        docker push $ACCOUNT_ID.dkr.ecr.$REGION.amazonaws.com/nodejs-app:latest

    # 7. Deploy to EC2 via SSH
    - name: Deploy to EC2
      uses: appleboy/ssh-action@v0.1.7
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          docker pull $ACCOUNT_ID.dkr.ecr.$REGION.amazonaws.com/nodejs-app:latest
          docker stop nodejs-app || true
          docker rm nodejs-app || true
          docker run -d --name nodejs-app -p 80:3000 $ACCOUNT_ID.dkr.ecr.$REGION.amazonaws.com/nodejs-app:latest