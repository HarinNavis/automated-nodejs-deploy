name: Node.js CI/CD to AWS EC2

on:
  push:
    branches:
      - main
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Configure AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # 3. Login to ECR
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # 4. Build Docker image
      - name: Build Docker image
        run: |
          IMAGE_NAME=harinnavis/nodejs-app:latest
          docker build -t $IMAGE_NAME ./app

      # 5. Tag Docker image
      - name: Tag Docker image
        run: |
          ACCOUNT_ID=${{ secrets.AWS_ACCOUNT_ID }}
          REGION=us-east-1
          IMAGE_NAME=harinnavis/nodejs-app:latest
          docker tag $IMAGE_NAME $ACCOUNT_ID.dkr.ecr.$REGION.amazonaws.com/nodejs-app:latest

      # 6. Push Docker image
      - name: Push Docker image
        run: |
          ACCOUNT_ID=${{ secrets.AWS_ACCOUNT_ID }}
          REGION=us-east-1
          docker push $ACCOUNT_ID.dkr.ecr.$REGION.amazonaws.com/nodejs-app:latest

      # 7. Deploy to EC2
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.7
        with:
            host: ${{ secrets.EC2_HOST }}
            username: ${{ secrets.EC2_USER }}
            key: ${{ secrets.EC2_SSH_KEY }}
            envs: ACCOUNT_ID,REGION
            script: |
               AWS_ACCOUNT_ID=${{ secrets.AWS_ACCOUNT_ID }}
               REGION=us-east-1

            IMAGE=$AWS_ACCOUNT_ID.dkr.ecr.$REGION.amazonaws.com/nodejs-app:latest
            PREV_IMAGE=nodejs-app:previous

            echo "Logging into ECR..."
            aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$REGION.amazonaws.com

            echo "Pulling latest image..."
            docker pull $IMAGE

            echo "Saving backup image..."
            docker tag $IMAGE $PREV_IMAGE || true

            echo "Stopping old container..."
            docker stop nodejs-app || true
            docker rm nodejs-app || true

            echo "Starting new container..."
            docker run -d --name nodejs-app -p 80:3000 $IMAGE

            echo "Waiting..."
            sleep 10

            echo "Health check..."
            if curl -f http://localhost:80; then
               echo "SUCCESS"
            else
               echo "FAILED → Rolling back"
               docker stop nodejs-app || true
               docker rm nodejs-app || true
               docker run -d --name nodejs-app -p 80
